campaign:
  id: cnn_pretrain_finetune
  loop_config: configs/agent_experiment_loop.yaml
  poll_seconds: 3600
  trial_budget: 20
  max_patch_leaf_count: 5
  max_single_trial_gpu_hours: 20
  remaining_gpu_hours: null
  max_decision_retries: 3
  scientific_state_path: state/scientific_state.yaml
  stages: ["10C", "13C"]
agent:
  max_output_tokens: 6000
objective:
  target: compound
  primary_metric: macro_f1
  required_primary_metric: true
  fallback_metrics: [balanced_accuracy, accuracy]
  tie_breaker_metrics: [roc_auc_ovr_macro, balanced_accuracy, accuracy]
  maximize: true
  minimums:
    action.accuracy: 0.30
artifacts:
  root: artifacts/campaigns/cnn_pretrain_finetune
logbook:
  path: EXPERIMENTS_LOGBOOK.md
prompts:
  analysis_policy: |
    Analyze completed finetune trials, deterministic failures/staleness, and live runs at polling time when the live evidence is strong enough to justify semantic early stopping. A trial is the full 10C-to-13C chain.
    Score trial success by downstream 13C compound performance, with action accuracy treated as a guardrail.
    Return terminate_trial only when the current live run is clearly wasting compute or cannot produce useful evidence; otherwise return no_action and keep training.
  update_logbook: |
    Write exactly two plain-English paragraphs in logbook_markdown: first the conclusion on how the run went, second what to try next and why.
    Do not include long file names or file paths in prose. The controller will put artifact links in the Files To Inspect table.
  patch_parameters: |
    Return small trial_patch mappings keyed by experiment id. Only patch allowlisted YAML paths from configs/agent_experiment_loop.yaml.
    Prefer one or two attributable changes per trial. Paired loss weights count as one conceptual change.
    For 10C model_config, only dropout and normalization are allowed; do not change architecture widths, kernels, grids, or embedding dimensions.
  decision_schema: |
    Return a single JSON object with this shape:
    {
      "decision": "no_action|propose_trial|terminate_trial|update_logbook|stop_campaign",
      "reason": "short reason",
      "logbook_markdown": "two plain-English paragraphs: conclusion, then next step",
      "trial_patch": "JSON string, for example {\"10C\":{\"optimization_config\":{\"epochs\":3}}}. For terminate_trial this is the replacement trial patch."
    }
    Do not include markdown fences or text outside the JSON object.
