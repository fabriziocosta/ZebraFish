    cand_20260723_13c_rotation_regularization_v1:
      id: cand_20260723_13c_rotation_regularization_v1
      title: Moderately increase 13C rotation augmentation to reduce observed generalization
        gaps
      purpose: Test whether stronger but bounded finetune augmentation improves compound
        objective performance while preserving action guardrail.
      question_id: q_cnn_pretrain_finetune_objective
      hypothesis_ids:
      - hyp_cnn_pretrain_finetune_objective
      base_experiment: cnn_pretrain_finetune_20260704_141700_197670
      configuration_patch:
        13C:
          train_num_random_rotations: 8
          rotation_range_degrees: 20
      fixed_variables:
        10C: identical to base experiment
        13C: all settings identical to base experiment except train_num_random_rotations
          and rotation_range_degrees
      expected_outcomes:
      - compound.macro_f1 improves versus cnn_pretrain_finetune_20260704_141700_197670
      - action.accuracy remains >= 0.3
      - 13C end-of-run train/validation loss gaps are reduced for val_loss and alignment
        losses relative to observed base gaps
      falsification_criteria:
      - compound.macro_f1 does not exceed 0.25280931819393354
      - action.accuracy < 0.3
      - generalization-gap indicators remain unchanged or worsen versus base for val_loss
        or alignment losses
      estimated_gpu_hours: 14
      estimated_wall_hours: 20
      risks:
      - augmentation may be too strong and reduce fit quality
      - improvement may appear in robustness metrics without increasing macro_f1
      allowed_stages:
      - 13C
      baseline: false
      status: proposed
      provenance:
