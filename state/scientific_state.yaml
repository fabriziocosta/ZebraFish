/candidate_experiments/-:
  id: cand_20260723_augmentation_gap_test
  title: Increase 13C rotation augmentation to counter observed generalisation gaps
  purpose: Test whether stronger finetune-time rotation augmentation improves compound
    macro-F1 without violating action accuracy guardrail.
  question_id: q_cnn_pretrain_finetune_objective
  hypothesis_ids:
  - A bounded optimisation change can improve the campaign objective.
  base_experiment: cnn_pretrain_finetune_20260704_141700_197670
  configuration_patch: '{"13C":{"train_num_random_rotations":8,"rotation_range_degrees":25}}'
  fixed_variables: '{"10C":"identical to base experiment","13C":"all non-augmentation
    settings identical to base experiment"}'
  expected_outcomes:
  - compound.macro_f1 increases versus base trial cnn_pretrain_finetune_20260704_141700_197670
  - action.accuracy remains >= 0.3 guardrail
  - reduced train-vs-validation loss gap at 13C end relative to base
  falsification_criteria:
  - compound.macro_f1 does not exceed 0.25280931819393354
  - action.accuracy < 0.3
  - generalisation-gap observations remain unchanged or worsen for val_loss/alignment
    losses
  estimated_gpu_hours: 14.0
  estimated_wall_hours: 20.0
  risks:
  - Excessive augmentation may underfit and reduce both action and compound accuracy
  - Longer effective convergence time in 13C
  allowed_stages:
  - 13C
  baseline: false
  created_at: '2026-07-23T13:29:00+00:00'
  provenance:
    created_by: autonomous_controller
    reason: Observed 13C plateau plus generalisation gaps with best-scoring completed
      trial; test bounded augmentation-only change.
